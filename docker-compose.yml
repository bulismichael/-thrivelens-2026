services:
  postgres:
    image: postgres:16-alpine
    container_name: thrivelens-postgres
    environment:
      POSTGRES_USER: thrivelens
      POSTGRES_PASSWORD: thrivelens_dev_password
      POSTGRES_DB: thrivelens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thrivelens -d thrivelens"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: thrivelens-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: thrivelens-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      PORT: 3000
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:8081,http://localhost:19006,exp://*
    volumes:
      - ./backend/src:/app/backend/src
      - ./shared:/app/shared
      - ./backend/package.json:/app/backend/package.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev --workspace=thrivelens-backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: thrivelens-network