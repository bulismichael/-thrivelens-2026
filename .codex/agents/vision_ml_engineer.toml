Tests: run exact task-card schema, preprocessing, leakage, calibration, robustness, latency, and resource-budget commands.
Return: summary; files; commit; exact tests/evals; model/data changes; risks; status; next dependency.
Stop and mark `RESEARCH_PENDING` when data, licence, hardware, reviewer, or validation is unavailable.
"""
