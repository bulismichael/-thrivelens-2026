services:
  postgres:
    profiles: ["postgres-explicit"]
    platform: linux/amd64
    image: postgres:17.10-bookworm@sha256:6e5a6518f9d2ff9e9f4cba2a5a87d8f41b0f067f6f92ac847c344351a6c8d923
    restart: "no"
    environment:
      POSTGRES_USER: ${TL_POSTGRES_ADMIN_USER:?Set TL_POSTGRES_ADMIN_USER}
      POSTGRES_DB: ${TL_POSTGRES_DATABASE:?Set TL_POSTGRES_DATABASE}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256 --data-checksums
    secrets:
      - postgres_admin_password
    ports:
      - "127.0.0.1:${TL_POSTGRES_PORT:-55432}:5432"
    volumes:
      - type: bind
        source: ${LOCALAPPDATA:?LOCALAPPDATA is required}/ThriveLens/data/postgresql/compose-r0
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 512m
    shm_size: 64mb
    stop_grace_period: 30s

secrets:
  postgres_admin_password:
    file: ${TL_POSTGRES_ADMIN_PASSWORD_FILE:?Set TL_POSTGRES_ADMIN_PASSWORD_FILE}
